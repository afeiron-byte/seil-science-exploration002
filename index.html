<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학탐구일지 - 세일고등학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        textarea::-webkit-scrollbar { display: none; }
        
        @media print {
            body { background-color: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: A4; margin: 0; }
            .print-hide { display: none !important; }
            .a4-container {
                box-shadow: none !important; margin: 0 !important; padding: 15mm 20mm !important; 
                width: 100% !important; height: 100vh !important; page-break-after: always;
            }
            .a4-container:last-child { page-break-after: auto; }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- 1. 로그인 화면 -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl p-8 max-w-md w-full border-t-4 border-red-700">
            <div class="text-center mb-6">
                <img src="세일고CI-01.png" alt="세일고 로고" class="w-24 h-24 mx-auto mb-4 drop-shadow-md">
                <h1 class="text-2xl font-bold text-gray-800">과학탐구일지 시스템</h1>
            </div>
            <div class="space-y-4 mt-8">
                <input type="text" id="loginId" placeholder="아이디" class="w-full px-4 py-3 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-700">
                <input type="password" id="loginPw" placeholder="비밀번호" class="w-full px-4 py-3 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-700">
                <div class="flex space-x-2 pt-2 border-t">
                    <input type="text" id="studentId" placeholder="학번 (예: 10101)" class="w-1/2 px-4 py-3 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-700">
                    <input type="text" id="authorName" placeholder="이름 (예: 홍길동)" class="w-1/2 px-4 py-3 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-red-700">
                </div>
                <button onclick="handleLogin()" id="loginBtn" class="w-full bg-red-700 text-white py-3 rounded-lg font-bold hover:bg-red-800 transition shadow-md mt-4">접속하기</button>
                <p id="loginError" class="text-red-500 text-sm text-center hidden font-medium"></p>
            </div>
        </div>
    </div>

    <!-- 2. 메인 대시보드 (로그인 후) -->
    <div id="mainScreen" class="hidden min-h-screen py-8 print:py-0 print:bg-white">
        
        <!-- 상단 네비게이션 및 컨트롤 패널 -->
        <div class="max-w-[210mm] mx-auto flex justify-between items-center mb-6 print-hide px-4">
            <div class="space-x-2">
                <button onclick="startNewEntry()" id="tabWrite" class="bg-red-700 text-white px-5 py-2 rounded-lg font-bold shadow transition">📝 새 일지 작성</button>
                <button onclick="switchTab('list')" id="tabList" class="bg-white text-gray-700 border px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-gray-50 transition">📚 누적 일지 모아보기</button>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-sm font-bold text-gray-600 bg-gray-200 px-3 py-1 rounded-full"><span id="currentUser"></span> 님</span>
                <button onclick="window.print()" class="bg-gray-800 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-gray-700 transition">🖨️ PDF 출력</button>
            </div>
        </div>

        <!-- [모드 1] 일지 작성 및 수정 폼 -->
        <div id="writeSection">
            <div class="a4-container bg-white shadow-2xl mx-auto p-[20mm] relative flex flex-col mb-6" style="width: 210mm; min-height: 297mm; box-sizing: border-box;">
                <div class="mb-6 border-b-4 border-gray-800 pb-2 flex flex-col items-center relative">
                    <h1 class="text-4xl font-black tracking-widest text-gray-900 mb-4">과학탐구일지</h1>
                    <div class="absolute bottom-1 right-0 text-sm font-bold text-gray-700 bg-white px-2">작성자: <span id="formAuthor"></span></div>
                </div>

                <div class="space-y-6 text-[15px] flex-grow">
                    <div>
                        <div class="grid grid-cols-2 gap-y-4 gap-x-2 items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-gray-700 min-w-max">탐구 회차/일시:</span> 
                                <input type="text" id="sessionDate" class="border-b-2 border-gray-300 w-full bg-transparent px-1 focus:outline-none" placeholder="[ ]일 차 / O월 O일 (시간: [ ]:[ ])">
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-gray-700 min-w-max">환경 조건:</span> 
                                기온 <input type="text" id="temp" class="border-b-2 border-gray-300 w-12 text-center bg-transparent focus:outline-none">℃, 
                                습도 <input type="text" id="humidity" class="border-b-2 border-gray-300 w-12 text-center bg-transparent focus:outline-none">%
                            </div>
                            <div class="col-span-2 flex items-center space-x-2">
                                <span class="font-bold text-gray-700 min-w-max">기타 특이사항:</span> 
                                <input type="text" id="weather" class="border-b-2 border-gray-300 w-full bg-transparent px-1 focus:outline-none" placeholder="(날씨, 조명 상태 등)">
                            </div>
                        </div>
                    </div>

                    <table class="w-full border-collapse border-2 border-gray-800 table-fixed">
                        <colgroup><col class="w-[28%]"><col class="w-[72%]"></colgroup>
                        <tbody>
                            <tr>
                                <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">2. 탐구 활동 내용</th>
                                <td class="border border-gray-400 p-0"><textarea id="activityContent" class="w-full block min-h-[80px] p-3 resize-none overflow-hidden focus:outline-none" oninput="autoResize(this)" placeholder="탐구 활동 내용을 작성하세요."></textarea></td>
                            </tr>
                            <tr>
                                <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">3. 탐구 및<br><span class="pl-5">탐구 결과</span></th>
                                <td class="border border-gray-400 p-0"><textarea id="resultContent" class="w-full block min-h-[150px] p-3 resize-none overflow-hidden focus:outline-none" oninput="autoResize(this)" placeholder="상세히 기록하세요."></textarea></td>
                            </tr>
                            <tr>
                                <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">4. 특이사항<br><span class="text-[13px] font-normal text-gray-600 block mt-1">(오늘 활동으로 확인한 내용)</span></th>
                                <td class="border border-gray-400 p-0"><textarea id="specialNote" class="w-full block min-h-[100px] p-3 resize-none overflow-hidden focus:outline-none" oninput="autoResize(this)" placeholder="오차 원인, 알게 된 점 등."></textarea></td>
                            </tr>
                            <tr>
                                <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">5. 주요 활동<br><span class="pl-5">사진</span></th>
                                <td class="border border-gray-400 p-3">
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <input type="file" accept="image/*" class="photoInput mb-2 block w-full text-xs print-hide" data-id="1" id="fileInput1">
                                            <div class="w-full h-[180px] flex items-center justify-center border-2 border-dashed border-gray-300 bg-gray-50 relative overflow-hidden">
                                                <span class="text-gray-400 text-sm print-hide" id="imgText1">사진 1 첨부</span>
                                                <img id="imgPreview1" class="absolute hidden max-w-full max-h-full object-contain">
                                            </div>
                                        </div>
                                        <div>
                                            <input type="file" accept="image/*" class="photoInput mb-2 block w-full text-xs print-hide" data-id="2" id="fileInput2">
                                            <div class="w-full h-[180px] flex items-center justify-center border-2 border-dashed border-gray-300 bg-gray-50 relative overflow-hidden">
                                                <span class="text-gray-400 text-sm print-hide" id="imgText2">사진 2 첨부</span>
                                                <img id="imgPreview2" class="absolute hidden max-w-full max-h-full object-contain">
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="mt-8 flex justify-end items-center space-x-3 pt-4">
                    <img src="세일고CI-01.png" alt="세일고 로고" class="w-10 h-10">
                    <span class="font-bold text-2xl tracking-widest text-gray-900" style="font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;">세일고등학교</span>
                </div>
            </div>

            <!-- 저장 버튼 -->
            <div class="text-center print-hide pb-10">
                <button onclick="saveData()" id="saveBtn" class="bg-red-700 text-white px-10 py-4 rounded-xl font-bold shadow-lg hover:bg-red-800 transition text-lg flex items-center justify-center mx-auto">
                    스프레드시트에 일지 저장하기
                </button>
                <p id="saveMsg" class="mt-2 text-sm font-bold hidden"></p>
            </div>
        </div>

        <!-- [모드 2] 누적 일지 모아보기 (목록) -->
        <div id="listSection" class="hidden">
            <div id="loadingMsg" class="text-center py-20 text-xl font-bold text-gray-500">데이터를 불러오는 중입니다...</div>
            <div id="entriesContainer" class="flex flex-col items-center"></div>
        </div>

    </div>

    <script>
        // ★★★ 새 버전으로 배포하고 얻은 URL로 변경하세요! ★★★
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRRgVSgjnTW4p2F22poz18EQHrfyLEBoKK9iY8AVVr7fWXUvpf5zrziLnH5v7oPP-_/exec"; 

        let imgData1 = "";
        let imgData2 = "";
        let currentEditTimestamp = ""; // 수정 모드일 때 해당 글의 고유값 저장
        let globalEntries = []; // 불러온 데이터를 저장하는 배열

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        async function handleLogin() {
            const id = document.getElementById('loginId').value;
            const pw = document.getElementById('loginPw').value;
            const stuId = document.getElementById('studentId').value;
            const name = document.getElementById('authorName').value;
            const errorMsg = document.getElementById('loginError');

            if (!id || !pw || !stuId || !name) {
                errorMsg.textContent = "모든 항목을 입력해주세요.";
                errorMsg.classList.remove('hidden');
                return;
            }

            document.getElementById('loginBtn').textContent = "접속 중...";
            try {
                const formData = new URLSearchParams();
                formData.append('action', 'login');
                formData.append('id', id);
                formData.append('pw', pw);

                const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
                const result = await response.json();

                if (result.success) {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainScreen').classList.remove('hidden');
                    const userStr = `${stuId} ${name}`;
                    document.getElementById('currentUser').textContent = userStr;
                    document.getElementById('formAuthor').textContent = userStr;
                } else {
                    errorMsg.textContent = result.error || "일치하지 않습니다.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                errorMsg.textContent = "서버 연결 실패";
                errorMsg.classList.remove('hidden');
            } finally {
                document.getElementById('loginBtn').textContent = "접속하기";
            }
        }

        document.querySelectorAll('.photoInput').forEach(input => {
            input.addEventListener('change', function(e) {
                const idNum = e.target.getAttribute('data-id');
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        
                        const base64 = canvas.toDataURL('image/jpeg', 0.7);
                        if(idNum === "1") imgData1 = base64;
                        else imgData2 = base64;
                        
                        const preview = document.getElementById(`imgPreview${idNum}`);
                        preview.src = base64;
                        preview.classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        // 폼 초기화 (새 글 작성용)
        function clearForm() {
            currentEditTimestamp = ""; // 수정 고유값 초기화
            document.getElementById('saveBtn').textContent = "스프레드시트에 일지 저장하기";
            
            document.getElementById('sessionDate').value = "";
            document.getElementById('temp').value = "";
            document.getElementById('humidity').value = "";
            document.getElementById('weather').value = "";
            document.getElementById('activityContent').value = "";
            document.getElementById('resultContent').value = "";
            document.getElementById('specialNote').value = "";
            
            // 높이 초기화
            document.querySelectorAll('textarea').forEach(ta => autoResize(ta));

            imgData1 = ""; imgData2 = "";
            document.getElementById('fileInput1').value = "";
            document.getElementById('fileInput2').value = "";
            document.getElementById('imgPreview1').classList.add('hidden');
            document.getElementById('imgPreview2').classList.add('hidden');
        }

        // "새 일지 작성" 버튼 클릭 시
        function startNewEntry() {
            clearForm();
            switchTab('write');
        }

        // 수정하기 버튼 클릭 시 데이터 불러오기
        function editEntry(index) {
            const entry = globalEntries[index];
            currentEditTimestamp = entry.Timestamp; // 덮어쓰기를 위한 고유키 저장

            document.getElementById('sessionDate').value = entry.SessionDate || "";
            document.getElementById('temp').value = entry.Temp || "";
            document.getElementById('humidity').value = entry.Humidity || "";
            document.getElementById('weather').value = entry.Weather || "";
            document.getElementById('activityContent').value = entry.ActivityContent || "";
            document.getElementById('resultContent').value = entry.ResultContent || "";
            document.getElementById('specialNote').value = entry.SpecialNote || "";

            // 텍스트 내용에 맞게 높이 자동 조절
            document.querySelectorAll('textarea').forEach(ta => autoResize(ta));

            // 이미지 세팅
            imgData1 = entry.Photo1 || "";
            if (imgData1) {
                document.getElementById('imgPreview1').src = imgData1;
                document.getElementById('imgPreview1').classList.remove('hidden');
            }
            imgData2 = entry.Photo2 || "";
            if (imgData2) {
                document.getElementById('imgPreview2').src = imgData2;
                document.getElementById('imgPreview2').classList.remove('hidden');
            }

            document.getElementById('saveBtn').textContent = "수정된 내용 덮어쓰기";
            switchTab('write'); // 작성 탭으로 전환
            window.scrollTo(0, 0); // 맨 위로 스크롤
        }

        async function saveData() {
            const btn = document.getElementById('saveBtn');
            const msg = document.getElementById('saveMsg');
            const originalText = btn.textContent;
            
            btn.textContent = "저장 중..."; btn.disabled = true; msg.classList.add('hidden');

            const formData = new URLSearchParams();
            formData.append('action', 'save');
            formData.append('timestamp', currentEditTimestamp); // 이 값이 있으면 덮어쓰기, 없으면 새로 작성됨
            formData.append('author', document.getElementById('formAuthor').textContent);
            formData.append('sessionDate', document.getElementById('sessionDate').value);
            formData.append('temp', document.getElementById('temp').value);
            formData.append('humidity', document.getElementById('humidity').value);
            formData.append('weather', document.getElementById('weather').value);
            formData.append('activityContent', document.getElementById('activityContent').value);
            formData.append('resultContent', document.getElementById('resultContent').value);
            formData.append('specialNote', document.getElementById('specialNote').value);
            formData.append('photo1', imgData1);
            formData.append('photo2', imgData2);

            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
                const result = await response.json();
                if (result.success) {
                    msg.textContent = "성공적으로 저장되었습니다!";
                    msg.className = "mt-2 text-sm font-bold text-green-600 block";
                    setTimeout(() => {
                        msg.classList.add('hidden');
                        clearForm();
                        switchTab('list'); // 저장 후 다시 모아보기 화면으로 이동
                    }, 1500); 
                } else throw new Error();
            } catch (error) {
                msg.textContent = "저장 오류 발생";
                msg.className = "mt-2 text-sm font-bold text-red-600 block";
            } finally {
                btn.textContent = originalText; btn.disabled = false;
            }
        }

        function switchTab(mode) {
            const btnW = document.getElementById('tabWrite');
            const btnL = document.getElementById('tabList');
            const secW = document.getElementById('writeSection');
            const secL = document.getElementById('listSection');

            if (mode === 'write') {
                btnW.className = "bg-red-700 text-white px-5 py-2 rounded-lg font-bold shadow transition";
                btnL.className = "bg-white text-gray-700 border px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-gray-50 transition";
                secW.classList.remove('hidden'); secL.classList.add('hidden');
            } else {
                btnW.className = "bg-white text-gray-700 border px-5 py-2 rounded-lg font-bold shadow-sm hover:bg-gray-50 transition";
                btnL.className = "bg-gray-800 text-white px-5 py-2 rounded-lg font-bold shadow transition";
                secW.classList.add('hidden'); secL.classList.remove('hidden');
                loadEntries(); 
            }
        }

        async function loadEntries() {
            const container = document.getElementById('entriesContainer');
            const loading = document.getElementById('loadingMsg');
            container.innerHTML = ""; loading.classList.remove('hidden');

            try {
                const formData = new URLSearchParams();
                formData.append('action', 'getEntries');
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
                const result = await response.json();

                loading.classList.add('hidden');

                if (result.success && result.data.length > 0) {
                    globalEntries = result.data; // 글로벌 변수에 저장 (수정할 때 사용)
                    
                    globalEntries.forEach((entry, index) => {
                        const div = document.createElement('div');
                        div.className = "a4-container bg-white shadow-xl p-[20mm] relative flex flex-col mb-10";
                        div.style.width = "210mm"; div.style.minHeight = "297mm"; div.style.boxSizing = "border-box";

                        const p1HTML = entry.Photo1 ? `<img src="${entry.Photo1}" class="max-w-full max-h-[180px] object-contain mx-auto">` : `<span class="text-gray-300 text-sm">사진 없음</span>`;
                        const p2HTML = entry.Photo2 ? `<img src="${entry.Photo2}" class="max-w-full max-h-[180px] object-contain mx-auto">` : `<span class="text-gray-300 text-sm">사진 없음</span>`;

                        div.innerHTML = `
                            <!-- 오른쪽 상단 수정 버튼 추가 (인쇄 시 안 보임) -->
                            <button onclick="editEntry(${index})" class="absolute top-6 right-6 print-hide bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-blue-700 transition">
                                ✏️ 내용 수정하기
                            </button>

                            <div class="mb-6 border-b-4 border-gray-800 pb-2 flex flex-col items-center relative mt-4">
                                <h1 class="text-4xl font-black tracking-widest text-gray-900 mb-4">과학탐구일지</h1>
                                <div class="absolute bottom-1 right-0 text-sm font-bold text-gray-700 bg-white px-2">작성자: ${entry.Author}</div>
                            </div>
                            <div class="space-y-6 text-[15px] flex-grow">
                                <div class="grid grid-cols-2 gap-y-4 gap-x-2 items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                                    <div><span class="font-bold">탐구 회차/일시:</span> ${entry.SessionDate}</div>
                                    <div><span class="font-bold">환경 조건:</span> 기온 ${entry.Temp}℃, 습도 ${entry.Humidity}%</div>
                                    <div class="col-span-2"><span class="font-bold">기타 특이사항:</span> ${entry.Weather}</div>
                                </div>
                                <table class="w-full border-collapse border-2 border-gray-800 table-fixed">
                                    <colgroup><col class="w-[28%]"><col class="w-[72%]"></colgroup>
                                    <tbody>
                                        <tr><th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">2. 탐구 활동 내용</th>
                                            <td class="border border-gray-400 p-3 whitespace-pre-wrap leading-relaxed">${entry.ActivityContent}</td></tr>
                                        <tr><th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">3. 탐구 및<br><span class="pl-5">탐구 결과</span></th>
                                            <td class="border border-gray-400 p-3 whitespace-pre-wrap leading-relaxed min-h-[150px]">${entry.ResultContent}</td></tr>
                                        <tr><th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">4. 특이사항<br><span class="text-[13px] font-normal text-gray-600 block mt-1">(오늘 활동으로 확인한 내용)</span></th>
                                            <td class="border border-gray-400 p-3 whitespace-pre-wrap leading-relaxed min-h-[100px]">${entry.SpecialNote}</td></tr>
                                        <tr><th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold">5. 주요 활동<br><span class="pl-5">사진</span></th>
                                            <td class="border border-gray-400 p-3">
                                                <div class="grid grid-cols-2 gap-3">
                                                    <div class="w-full h-[180px] flex items-center justify-center border border-gray-200">${p1HTML}</div>
                                                    <div class="w-full h-[180px] flex items-center justify-center border border-gray-200">${p2HTML}</div>
                                                </div>
                                            </td></tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="mt-8 flex justify-end items-center space-x-3 pt-4">
                                <img src="세일고CI-01.png" class="w-10 h-10">
                                <span class="font-bold text-2xl tracking-widest text-gray-900" style="font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;">세일고등학교</span>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = `<div class="py-20 text-gray-500">저장된 일지가 없습니다.</div>`;
                }
            } catch (err) {
                loading.textContent = "데이터를 불러오는 중 오류가 발생했습니다.";
            }
        }
    </script>
</body>
