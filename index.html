<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학탐구일지 - 세일고등학교</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        textarea::-webkit-scrollbar { display: none; }
        @media print {
            body { background-color: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { size: A4; margin: 0; }
            .print-hide { display: none !important; }
            .a4-container {
                box-shadow: none !important; margin: 0 !important; padding: 15mm 20mm !important; 
                width: 100% !important; height: 100vh !important; page-break-after: avoid;
            }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- 1. 로그인 화면 -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl p-8 max-w-md w-full border-t-4 border-red-700">
            <div class="text-center mb-6">
                <img src="세일고CI-01.png" alt="세일고 로고" class="w-24 h-24 mx-auto mb-4 drop-shadow-md">
                <h1 class="text-2xl font-bold text-gray-800">과학탐구일지 시스템</h1>
            </div>
            
            <div class="space-y-4 mt-8">
                <input type="text" id="loginId" placeholder="아이디" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 bg-gray-50">
                <input type="password" id="loginPw" placeholder="비밀번호" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 bg-gray-50">
                
                <div class="flex space-x-2 pt-2 border-t">
                    <input type="text" id="studentId" placeholder="학번 (예: 10101)" class="w-1/2 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 bg-gray-50">
                    <input type="text" id="authorName" placeholder="이름 (예: 홍길동)" class="w-1/2 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-700 bg-gray-50">
                </div>
                
                <button onclick="handleLogin()" id="loginBtn" class="w-full bg-red-700 text-white py-3 rounded-lg hover:bg-red-800 transition font-bold shadow-md mt-4">
                    접속하기
                </button>
                <p id="loginError" class="text-red-500 text-sm text-center hidden font-medium"></p>
            </div>
        </div>
    </div>

    <!-- 2. 탐구일지 작성 화면 -->
    <div id="mainScreen" class="hidden min-h-screen py-8 print:py-0 print:bg-white">
        <!-- 상단 컨트롤 패널 (인쇄 시 숨김) -->
        <div class="max-w-[210mm] mx-auto flex justify-end items-center mb-4 print-hide px-4">
            <div class="space-x-2">
                <button onclick="window.print()" class="bg-gray-800 text-white px-5 py-2 rounded-lg shadow hover:bg-gray-700 font-bold transition">🖨️ PDF 출력</button>
                <button onclick="location.reload()" class="bg-white text-gray-600 border px-4 py-2 rounded-lg shadow-sm hover:bg-gray-50 transition">로그아웃</button>
            </div>
        </div>

        <!-- A4 용지 컨테이너 -->
        <div class="a4-container bg-white shadow-2xl mx-auto p-[20mm] relative flex flex-col mb-10" style="width: 210mm; min-height: 297mm; box-sizing: border-box;">
            
            <!-- 문서 제목 및 작성자 영역 -->
            <div class="mb-6 border-b-4 border-gray-800 pb-2 flex flex-col items-center relative">
                <h1 class="text-4xl font-black tracking-widest text-gray-900 mb-4">과학탐구일지</h1>
                <!-- 작성자가 제목 아래, 가로선 위(우측 정렬)에 위치하도록 수정 -->
                <div class="absolute bottom-1 right-0 text-sm font-bold text-gray-700 bg-white px-2">
                    작성자: <span id="currentUser" class="text-gray-900"></span>
                </div>
            </div>

            <!-- 입력 폼 시작 -->
            <div class="space-y-6 text-[15px] flex-grow">
                <!-- 1. 기본 기록 -->
                <div>
                    <div class="grid grid-cols-2 gap-y-4 gap-x-2 items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-gray-700 min-w-max">탐구 회차/일시:</span> 
                            <input type="text" id="sessionDate" class="border-b-2 border-gray-300 w-full focus:outline-none focus:border-red-700 bg-transparent px-1" placeholder="[  ]일 차 / O월 O일 (시간: [ ]:[ ])">
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-gray-700 min-w-max">환경 조건:</span> 
                            기온 <input type="text" id="temp" class="border-b-2 border-gray-300 w-12 text-center focus:outline-none focus:border-red-700 bg-transparent" placeholder="">℃, 
                            습도 <input type="text" id="humidity" class="border-b-2 border-gray-300 w-12 text-center focus:outline-none focus:border-red-700 bg-transparent" placeholder="">%
                        </div>
                        <div class="col-span-2 flex items-center space-x-2">
                            <span class="font-bold text-gray-700 min-w-max">기타 특이사항:</span> 
                            <input type="text" id="weather" class="border-b-2 border-gray-300 w-full focus:outline-none focus:border-red-700 bg-transparent px-1" placeholder="(날씨, 조명 상태 등)">
                        </div>
                    </div>
                </div>

                <!-- 2, 3, 4, 5 항목 테이블 구조 (2번 항목 셀로 통합) -->
                <table class="w-full border-collapse border-2 border-gray-800 table-fixed">
                    <colgroup>
                        <col class="w-[28%]">
                        <col class="w-[72%]">
                    </colgroup>
                    <tbody>
                        <!-- 2. 탐구 활동 내용 -->
                        <tr>
                            <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold text-gray-800">2. 탐구 활동 내용</th>
                            <td class="border border-gray-400 p-0"><textarea id="activityContent" class="w-full block min-h-[80px] p-3 focus:outline-none resize-none overflow-hidden" oninput="autoResize(this)" placeholder="오늘의 탐구 활동 내용을 작성하세요."></textarea></td>
                        </tr>
                        <!-- 3. 탐구 및 탐구 결과 -->
                        <tr>
                            <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold text-gray-800">3. 탐구 및<br><span class="pl-5">탐구 결과</span></th>
                            <td class="border border-gray-400 p-0"><textarea id="resultContent" class="w-full block min-h-[150px] p-3 focus:outline-none resize-none overflow-hidden" oninput="autoResize(this)" placeholder="탐구 과정 및 결과를 상세히 기록하세요."></textarea></td>
                        </tr>
                        <!-- 4. 특이사항 -->
                        <tr>
                            <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold text-gray-800">4. 특이사항<br><span class="text-[13px] font-normal text-gray-600 block mt-1 leading-tight">(오늘 활동으로 확인한 내용)</span></th>
                            <td class="border border-gray-400 p-0"><textarea id="specialNote" class="w-full block min-h-[100px] p-3 focus:outline-none resize-none overflow-hidden" oninput="autoResize(this)" placeholder="오차 원인, 새롭게 알게 된 점 등을 기록하세요."></textarea></td>
                        </tr>
                        <!-- 5. 주요 활동 사진 -->
                        <tr>
                            <th class="border border-gray-400 p-3 bg-gray-100 text-left align-top text-lg font-bold text-gray-800">5. 주요 활동<br><span class="pl-5">사진</span></th>
                            <td class="border border-gray-400 p-3">
                                <!-- 사진 두 장 첨부를 위한 2단 분할 구조 -->
                                <div class="grid grid-cols-2 gap-3">
                                    <!-- 첫 번째 사진 -->
                                    <div>
                                        <input type="file" accept="image/*" class="photoInput mb-2 print-hide block w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300 cursor-pointer" data-target="imageDisplay1">
                                        <div class="w-full h-[180px] flex items-center justify-center border-2 border-dashed border-gray-300 bg-gray-50 overflow-hidden relative">
                                            <span class="text-gray-400 text-sm print-hide">사진 1 첨부</span>
                                            <img id="imageDisplay1" class="absolute hidden max-w-full max-h-full object-contain">
                                        </div>
                                    </div>
                                    <!-- 두 번째 사진 -->
                                    <div>
                                        <input type="file" accept="image/*" class="photoInput mb-2 print-hide block w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300 cursor-pointer" data-target="imageDisplay2">
                                        <div class="w-full h-[180px] flex items-center justify-center border-2 border-dashed border-gray-300 bg-gray-50 overflow-hidden relative">
                                            <span class="text-gray-400 text-sm print-hide">사진 2 첨부</span>
                                            <img id="imageDisplay2" class="absolute hidden max-w-full max-h-full object-contain">
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 세일고등학교 로고 -->
            <div class="mt-8 flex justify-end items-center space-x-3 pt-4">
                <img src="세일고CI-01.png" alt="세일고등학교 마크" class="w-10 h-10">
                <!-- 맑은 고딕 볼드체 적용 -->
                <span class="font-bold text-2xl tracking-widest text-gray-900" style="font-family: 'Malgun Gothic', '맑은 고딕', dotum, sans-serif;">세일고등학교</span>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz307tQi-FA_eAlnMSxNgVbZ_LfWa_k8_nn-aYWuBB9xG8CE2lgU7Q4ERiMuXz2R_wD/exec"; 

        // 텍스트 내용에 따라 셀 높이가 자동으로 늘어나는 함수
        function autoResize(textarea) {
            textarea.style.height = 'auto'; // 높이 초기화
            textarea.style.height = textarea.scrollHeight + 'px'; // 스크롤 길이에 맞춰 높이 재설정
        }

        async function handleLogin() {
            const id = document.getElementById('loginId').value;
            const pw = document.getElementById('loginPw').value;
            const stuId = document.getElementById('studentId').value;
            const name = document.getElementById('authorName').value;
            const errorMsg = document.getElementById('loginError');
            const btnText = document.getElementById('loginBtn');

            if (!id || !pw || !stuId || !name) {
                errorMsg.textContent = "모든 항목을 입력해주세요.";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            btnText.textContent = "확인 중...";
            btnText.disabled = true;

            try {
                const formData = new URLSearchParams();
                formData.append('action', 'login');
                formData.append('id', id);
                formData.append('pw', pw);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                const result = await response.json();

                if (result.success) {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainScreen').classList.remove('hidden');
                    // 작성자 표시 업데이트
                    document.getElementById('currentUser').textContent = `${stuId} ${name}`;
                } else {
                    errorMsg.textContent = result.error || "아이디 또는 비밀번호가 일치하지 않습니다.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.textContent = "서버 연결 실패. 개발자 도구(F12) 콘솔을 확인하세요.";
                errorMsg.classList.remove('hidden');
            } finally {
                btnText.textContent = "접속하기";
                btnText.disabled = false;
            }
        }

        // 다중 이미지 처리를 위한 로직
        document.querySelectorAll('.photoInput').forEach(input => {
            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                const targetId = e.target.getAttribute('data-target'); // 이미지를 표시할 img 태그의 ID
                
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; // 해상도 조절
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 화면에 이미지 표시
                        const imgDisplay = document.getElementById(targetId);
                        imgDisplay.src = canvas.toDataURL('image/jpeg', 0.8);
                        imgDisplay.classList.remove('hidden');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        });
    </script>
</body>
</html>
